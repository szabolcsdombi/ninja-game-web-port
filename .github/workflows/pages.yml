name: pages

on:
  workflow_dispatch:

jobs:
  site:
    name: site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: build
        run: docker build . -f Containerfile --target site -o site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
